---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    volumes:
      # Persist uploaded images across rebuilds (public/uploads is gitignored
      # and would otherwise be wiped on every `make up-prod --build`).
      - ./public/uploads:/app/public/uploads
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: "auto_https off"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=main_network"
    networks:
      - default
      - main_network

  # Join the database to the shared traefik network so the existing
  # Adminer (domain_supp project, on main_network) can reach it.
  # No public port is exposed; connect to host "tesak-cernava-database-1".
  database:
    networks:
      - default
      - main_network

networks:
  main_network:
    external: true
